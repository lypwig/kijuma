[project]
name = "kijuma"
version = "0.1.0"
description = "Kit de jugement majoritaire"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "build123d",
]

[dependency-groups]
dev = [
    "basedpyright",
    "cadquery-ocp",
    "ocp-viewer",
    "ruff",
    "ty",
    "watchfiles",
]

[tool.ruff]
line-length = 91
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "D203", "D212", "F403", "F405", "T201"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportWildcardImportFromLibrary = false
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python = ".venv"

# necessary for sheet metal until 0.14.0 is out
[tool.uv.sources]
build123d = { git = "https://github.com/gumyr/build123d.git" }
